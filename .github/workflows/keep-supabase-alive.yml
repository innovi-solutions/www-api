name: Keep Supabase alive

# Supabase pauses free-tier projects after 7 days with no API requests hitting
# the project - internal pg_cron activity does NOT count, only real API calls
# do. This workflow makes a genuine REST call on a schedule that never leaves
# more than a 4-day gap, and reuses that call to also run the stale-leads
# archive job (safe to call more often than every 4 days - the SQL function
# gates itself and no-ops if it already ran within the last 4 days).
#
# Deliberately uses fixed weekdays (Mon/Thu) instead of a day-of-month */4
# pattern - */4 on the day-of-month field can leave a 7-day gap across short
# months (e.g. day 25 -> day 1 in February), which would defeat the purpose.

on:
  schedule:
    - cron: "0 3 * * 1,4"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call archive_stale_leads
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sf -X POST "$SUPABASE_URL/rest/v1/rpc/archive_stale_leads" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{}"
